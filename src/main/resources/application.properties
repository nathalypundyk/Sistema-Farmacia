spring.application.name=sistema-farmacia

# --- PostgreSQL --------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/farmacia_hgs
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DataLoader handles initial config data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Security Logging
logging.level.org.springframework.security=DEBUG
logging.level.sistema_farmacia.demo=DEBUG
server.port=8081

# --- NOTE: previous MySQL config was commented out for local demo. ---
# To use MySQL again, revert these settings and restore the MySQL URL/credentials.

# Límites de upload para importación de Excel
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
