spring.application.name=sistema-farmacia

# --- PostgreSQL --------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmacia_hgs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# DataLoader handles initial config data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Security Logging
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.sistema_farmacia.demo=${LOG_LEVEL_APP:INFO}
server.port=${SERVER_PORT:8081}

# Límites de upload para importación de Excel
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- WhatsApp Alertas ---
# whatsapp.api.url: URL del gateway WhatsApp (servicio "whatsapp" en docker-compose.yml,
#   código en whatsapp-gateway/). Fuera de Docker Compose, cambiar por http://localhost:3000.
whatsapp.api.url=${WHATSAPP_API_URL:http://whatsapp:3000}
whatsapp.encargada.numero=${WHATSAPP_ENCARGADA_NUMERO:595971249105}

# --- Cámara de frío (módulo Electrónica Digital y Microprocesadores) ---
# Clave que envía el script Python en el encabezado X-API-KEY. Cambiarla fuera del prototipo.
camarafrio.dispositivo.api-key=${CAMARAFRIO_API_KEY:hgs-camara-frio-demo}
# Umbrales de temperatura. Por defecto, los mismos del Arduino del docente (18 a 22 °C).
# Para una cadena de frío real de medicamentos se usaría 2 a 8 °C.
camarafrio.temp.min=${CAMARAFRIO_TEMP_MIN:18}
camarafrio.temp.max=${CAMARAFRIO_TEMP_MAX:22}
# Minutos mínimos entre dos alertas del mismo tipo (evita saturar el WhatsApp)
camarafrio.alerta.cooldown-minutos=${CAMARAFRIO_COOLDOWN_MIN:10}
# Segundos sin lecturas para considerar el dispositivo desconectado
camarafrio.dispositivo.timeout-segundos=60

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always