spring.application.name=sistema-farmacia

# Base de datos MySQL (nombre: farmacia)
spring.datasource.url=jdbc:mysql://localhost:3306/farmacia?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defer data.sql initialization until after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Security Logging
logging.level.org.springframework.security=DEBUG
logging.level.sistema_farmacia.demo=DEBUG
server.port=8081
