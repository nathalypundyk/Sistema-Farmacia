spring.application.name=sistema-farmacia

# --- PostgreSQL --------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmacia_hgs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# DataLoader handles initial config data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Security Logging
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.sistema_farmacia.demo=${LOG_LEVEL_APP:INFO}
server.port=${SERVER_PORT:8081}

# Límites de upload para importación de Excel
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- WhatsApp Alertas ---
# whatsapp.api.url: URL del gateway WhatsApp (servicio externo, no incluido en este repo).
#   - Si corre en la misma PC (fuera de Docker): usar host.docker.internal en vez de localhost.
#   - Si corre como otro contenedor en el mismo docker-compose: usar el nombre del servicio.
whatsapp.api.url=${WHATSAPP_API_URL:http://localhost:3000}
whatsapp.encargada.numero=${WHATSAPP_ENCARGADA_NUMERO:595986214339}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always