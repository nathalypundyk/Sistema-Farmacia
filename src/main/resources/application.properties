spring.application.name=sistema-farmacia

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:farmaciadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Defer data.sql initialization until after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# PostgreSQL Configuration (Enable for Production/Docker)
# spring.datasource.url=jdbc:postgresql://localhost:5432/farmaciadb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.hibernate.ddl-auto=update

# Security Logging
logging.level.org.springframework.security=DEBUG
logging.level.sistema_farmacia.demo=DEBUG
server.port=0
