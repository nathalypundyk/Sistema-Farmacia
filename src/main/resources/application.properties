spring.application.name=sistema-farmacia

# --- H2 in-memory database for local demo -------------------------------
# Uses an in-memory H2 DB so you can run the app without installing MySQL.
spring.datasource.url=jdbc:h2:mem:farmacia;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize data.sql on startup so demo data (if present) is loaded
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 console (optional) - access at /h2-console when app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security Logging
logging.level.org.springframework.security=DEBUG
logging.level.sistema_farmacia.demo=DEBUG
server.port=8081

# --- NOTE: previous MySQL config was commented out for local demo. ---
# To use MySQL again, revert these settings and restore the MySQL URL/credentials.
