<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">HGS Pharma - Sistema de Gestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>

<aside th:fragment="sidebar(activePage)" class="sidebar" id="mainSidebar">
    <div class="sidebar-brand">
        <h2 style="margin-bottom: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 10px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="sidebar-brand-text">HGS Pharma</span>
        </h2>
        <button class="sidebar-toggle" id="sidebarToggleBtn" onclick="toggleSidebar()" title="Colapsar menú">
            <svg id="toggleIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
    </div>
    <nav>
        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active'" title="Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span class="nav-text">Dashboard</span>
        </a>
        <a th:href="@{/lotes}" th:classappend="${activePage == 'lotes'} ? 'active'" title="Gestión Lotes">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span class="nav-text">Gestión Lotes</span>
        </a>
        <a th:href="@{/medicamentos}" th:classappend="${activePage == 'medicamentos'} ? 'active'" title="Medicamentos">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
            <span class="nav-text">Medicamentos</span>
        </a>
        <a th:href="@{/camara-frio}" th:classappend="${activePage == 'camara-frio'} ? 'active'" title="Cadena de frío" sec:authorize="hasAnyRole('ADMIN','FARMACEUTICO')">

            <span class="nav-text">Cadena de frío</span>
        </a>
        <a th:href="@{/config}" th:classappend="${activePage == 'config'} ? 'active'" title="Configuración" sec:authorize="hasRole('ADMIN')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="nav-text">Configuración</span>
        </a>
        <a th:href="@{/importacion}" th:classappend="${activePage == 'importacion'} ? 'active'" title="Importar Stock">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span class="nav-text">Importar Stock</span>
        </a>
        <a th:href="@{/importacion-siciap}" th:classappend="${activePage == 'importacion-siciap'} ? 'active'" title="Códigos SICIAP" sec:authorize="hasRole('ADMIN')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            <span class="nav-text">Códigos SICIAP</span>
        </a>
        <a th:href="@{/auditoria}" th:classappend="${activePage == 'auditoria'} ? 'active'" title="Auditoría" sec:authorize="hasRole('ADMIN')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span class="nav-text">Auditoría</span>
        </a>
        <a th:href="@{/usuarios}" th:classappend="${activePage == 'usuarios'} ? 'active'" title="Usuarios" sec:authorize="hasRole('ADMIN')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="nav-text">Usuarios</span>
        </a>
    </nav>

    <script>
        (function() {
            var sidebar = document.getElementById('mainSidebar');
            var icon = document.getElementById('toggleIcon');
            var collapsed = localStorage.getItem('sidebarCollapsed') === 'true';

            function applyState(c) {
                if (c) {
                    sidebar.classList.add('collapsed');
                    icon.setAttribute('viewBox', '0 0 24 24');
                    icon.innerHTML = '<polyline points="9 18 15 12 9 6"/>';
                } else {
                    sidebar.classList.remove('collapsed');
                    icon.innerHTML = '<polyline points="15 18 9 12 15 6"/>';
                }
            }

            window.toggleSidebar = function() {
                collapsed = !collapsed;
                localStorage.setItem('sidebarCollapsed', collapsed);
                applyState(collapsed);
            };

            applyState(collapsed);
        })();
    </script>
</aside>

<header th:fragment="header(pageTitle)" class="header">
    <div class="header-left">
        <h1 th:text="${pageTitle}">Panel</h1>
        <p th:text="${#calendars.format(#calendars.createNow(), 'EEEE, d MMMM yyyy')}" style="color: var(--text-secondary); font-size: 0.9rem;"></p>
    </div>
    
    <div class="header-right" style="display: flex; align-items: center;" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <div class="user-menu-container" style="position: relative; display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 4px; border-radius: 8px;" onclick="toggleUserMenu()">
            <div class="user-info" style="text-align: right;" sec:authorize="isAuthenticated()">
                <p style="font-weight: 600; font-size: 0.9rem;" sec:authentication="name">Usuario</p>
                <p style="color: var(--text-secondary); font-size: 0.8rem;" sec:authentication="principal.authorities[0].authority">Rol</p>
            </div>
            <div class="avatar" style="width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
                <span sec:authorize="isAuthenticated()" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
            </div>
            <svg style="color: var(--text-secondary);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            
            <!-- Dropdown Menu -->
            <div id="userDropdown" class="user-dropdown">
                <div class="dropdown-header" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); padding: 8px 16px 4px; font-weight: 600;">Aspecto</div>
                <div class="theme-options" style="padding: 4px 8px;">
                    <button class="theme-option" data-theme="light" onclick="setTheme('light'); event.stopPropagation();">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        Claro
                    </button>
                    <button class="theme-option" data-theme="dark" onclick="setTheme('dark'); event.stopPropagation();">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        Oscuro
                    </button>
                    <button class="theme-option" data-theme="system" onclick="setTheme('system'); event.stopPropagation();">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                        Sistema
                    </button>
                </div>
                <div class="dropdown-divider" style="height: 1px; background: var(--border-color); margin: 4px 0;"></div>
                <div style="padding: 4px 8px;" sec:authorize="isAuthenticated()">
                    <button type="button" class="dropdown-item" onclick="abrirCambiarPassword(); event.stopPropagation();"
                            style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; background: none; border: none; cursor: pointer; border-radius: 6px; font-size: 0.9rem; color: var(--text-main); text-align: left;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                        Cambiar mi contraseña
                    </button>
                    <button type="button" class="dropdown-item" onclick="abrirCambiarPin(); event.stopPropagation();"
                            style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; background: none; border: none; cursor: pointer; border-radius: 6px; font-size: 0.9rem; color: var(--text-main); text-align: left;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Cambiar mi PIN
                    </button>
                </div>
                <div class="dropdown-divider" style="height: 1px; background: var(--border-color); margin: 4px 0;"></div>
                <form th:action="@{/logout}" method="post" style="margin: 0; padding: 4px 8px;">
                    <button type="submit" class="dropdown-item text-danger" style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; background: none; border: none; cursor: pointer; border-radius: 6px; font-size: 0.9rem; color: #dc2626; text-align: left; transition: background 0.2s;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.style = `
                background: white;
                padding: 16px 24px;
                border-radius: 12px;
                box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
                margin-bottom: 10px;
                border-left: 4px solid ${type === 'danger' ? '#ef4444' : (type === 'warning' ? '#f59e0b' : '#3b82f6')};
                animation: slideIn 0.3s ease-out;
                display: flex;
                align-items: center;
                gap: 12px;
                min-width: 300px;
            `;
            toast.innerHTML = `
                <span style="font-size: 1.2rem;">${type === 'danger' ? '🚫' : (type === 'warning' ? '⚠️' : 'ℹ️')}</span>
                <span style="font-weight: 500; color: #1e293b;">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.5s ease-in';
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        // Example: Check for success/error in URL and show toast
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('success')) showToast('Operación completada con éxito', 'success');
            if (urlParams.has('error')) showToast('Error: ' + urlParams.get('error'), 'danger');
        });
    </script>

    <!-- ── Modal: Cambiar mi PIN (autoservicio, confirma con contraseña) ── -->
    <input type="hidden" id="csrfTokenPin" th:value="${_csrf != null ? _csrf.token : ''}">
    <input type="hidden" id="csrfHeaderPin" th:value="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
    <div id="cambiarPasswordModal" style="display:none; position:fixed; inset:0; z-index:4000;
         background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); align-items:center; justify-content:center;">
        <div style="background:var(--card-bg,#fff); border-radius:14px; padding:28px 32px; max-width:380px; width:90%;
                    box-shadow:0 24px 48px rgba(0,0,0,0.25);">
            <h3 style="margin:0 0 4px; font-size:1.1rem; font-weight:700; color:var(--text-main,#1e293b);">Cambiar mi contraseña</h3>
            <p style="font-size:0.84rem; color:var(--text-secondary); margin:0 0 18px;">
                Confirmá con tu contraseña actual.</p>

            <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:4px;">Contraseña actual</label>
            <input type="password" id="cwActual" autocomplete="current-password"
                   style="width:100%; box-sizing:border-box; padding:9px 12px; margin-bottom:12px;
                          border:1.5px solid var(--border-color); border-radius:8px; font-size:0.95rem;
                          background:var(--input-bg,#f8fafc); color:var(--text-main); outline:none;">

            <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:4px;">Nueva contraseña (mín. 6)</label>
            <input type="password" id="cwNueva" autocomplete="new-password"
                   style="width:100%; box-sizing:border-box; padding:9px 12px; margin-bottom:12px;
                          border:1.5px solid var(--border-color); border-radius:8px; font-size:0.95rem;
                          background:var(--input-bg,#f8fafc); color:var(--text-main); outline:none;">

            <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:4px;">Repetir nueva contraseña</label>
            <input type="password" id="cwConfirm" autocomplete="new-password"
                   onkeydown="if(event.key==='Enter') guardarCambioPassword()"
                   style="width:100%; box-sizing:border-box; padding:9px 12px; margin-bottom:6px;
                          border:1.5px solid var(--border-color); border-radius:8px; font-size:0.95rem;
                          background:var(--input-bg,#f8fafc); color:var(--text-main); outline:none;">

            <div id="cwMsg" style="font-size:0.82rem; min-height:18px; margin-bottom:12px;"></div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn" style="background:#f1f5f9; color:#475569; padding:8px 18px;"
                        onclick="cerrarCambiarPassword()">Cancelar</button>
                <button type="button" id="cwBtn" class="btn btn-primary" style="padding:8px 18px;"
                        onclick="guardarCambioPassword()">Guardar contraseña</button>
            </div>
        </div>
    </div>
    <div id="cambiarPinModal" style="display:none; position:fixed; inset:0; z-index:4000;
         background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); align-items:center; justify-content:center;">
        <div style="background:var(--card-bg,#fff); border-radius:14px; padding:28px 32px; max-width:380px; width:90%;
                    box-shadow:0 24px 48px rgba(0,0,0,0.25);">
            <h3 style="margin:0 0 4px; font-size:1.1rem; font-weight:700; color:var(--text-main,#1e293b);">Cambiar mi PIN</h3>
            <p style="font-size:0.84rem; color:var(--text-secondary); margin:0 0 18px;">
                Confirmá con tu contraseña de inicio de sesión.</p>

            <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:4px;">Tu contraseña</label>
            <input type="password" id="cpPassword" autocomplete="current-password"
                   style="width:100%; box-sizing:border-box; padding:9px 12px; margin-bottom:12px;
                          border:1.5px solid var(--border-color); border-radius:8px; font-size:0.95rem;
                          background:var(--input-bg,#f8fafc); color:var(--text-main); outline:none;">

            <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:4px;">PIN nuevo (mín. 4 dígitos)</label>
            <input type="password" id="cpNuevo" maxlength="10" inputmode="numeric"
                   style="width:100%; box-sizing:border-box; padding:9px 12px; margin-bottom:12px;
                          border:1.5px solid var(--border-color); border-radius:8px; font-size:0.95rem;
                          background:var(--input-bg,#f8fafc); color:var(--text-main); outline:none;">

            <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:4px;">Repetir PIN nuevo</label>
            <input type="password" id="cpConfirm" maxlength="10" inputmode="numeric"
                   onkeydown="if(event.key==='Enter') guardarCambioPin()"
                   style="width:100%; box-sizing:border-box; padding:9px 12px; margin-bottom:6px;
                          border:1.5px solid var(--border-color); border-radius:8px; font-size:0.95rem;
                          background:var(--input-bg,#f8fafc); color:var(--text-main); outline:none;">

            <div id="cpMsg" style="font-size:0.82rem; min-height:18px; margin-bottom:12px;"></div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn" style="background:#f1f5f9; color:#475569; padding:8px 18px;"
                        onclick="cerrarCambiarPin()">Cancelar</button>
                <button type="button" id="cpBtn" class="btn btn-primary" style="padding:8px 18px;"
                        onclick="guardarCambioPin()">Guardar PIN</button>
            </div>
        </div>
    </div>
    <script>
        function abrirCambiarPassword() {
            document.getElementById('cwActual').value = '';
            document.getElementById('cwNueva').value = '';
            document.getElementById('cwConfirm').value = '';
            document.getElementById('cwMsg').textContent = '';
            document.getElementById('cambiarPasswordModal').style.display = 'flex';
            setTimeout(() => document.getElementById('cwActual').focus(), 60);
        }
        function cerrarCambiarPassword() {
            document.getElementById('cambiarPasswordModal').style.display = 'none';
        }
        async function guardarCambioPassword() {
            const passwordActual  = document.getElementById('cwActual').value;
            const nuevaPassword   = document.getElementById('cwNueva').value;
            const confirmPassword = document.getElementById('cwConfirm').value;
            const msg = document.getElementById('cwMsg');
            msg.style.color = '#b91c1c';

            if (!passwordActual)              { msg.textContent = 'Ingresá tu contraseña actual.'; return; }
            if (nuevaPassword.length < 6)     { msg.textContent = 'La nueva contraseña debe tener al menos 6 caracteres.'; return; }
            if (nuevaPassword !== confirmPassword) { msg.textContent = 'Las contraseñas no coinciden.'; return; }

            const token  = document.getElementById('csrfTokenPin').value;
            const header = document.getElementById('csrfHeaderPin').value;
            const btn = document.getElementById('cwBtn');
            btn.disabled = true; btn.textContent = 'Guardando…';
            try {
                const resp = await fetch('/api/auth/cambiarPassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [header]: token },
                    body: JSON.stringify({ passwordActual, nuevaPassword, confirmPassword })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) { msg.textContent = data.error || 'No se pudo cambiar la contraseña.'; return; }
                msg.style.color = '#166534';
                msg.textContent = '✅ Contraseña actualizada.';
                setTimeout(cerrarCambiarPassword, 900);
            } catch (e) {
                msg.textContent = 'Error de red: ' + e.message;
            } finally {
                btn.disabled = false; btn.textContent = 'Guardar contraseña';
            }
        }
        function abrirCambiarPin() {
            document.getElementById('cpPassword').value = '';
            document.getElementById('cpNuevo').value = '';
            document.getElementById('cpConfirm').value = '';
            document.getElementById('cpMsg').textContent = '';
            document.getElementById('cambiarPinModal').style.display = 'flex';
            setTimeout(() => document.getElementById('cpPassword').focus(), 60);
        }
        function cerrarCambiarPin() {
            document.getElementById('cambiarPinModal').style.display = 'none';
        }
        async function guardarCambioPin() {
            const password   = document.getElementById('cpPassword').value;
            const nuevoPin    = document.getElementById('cpNuevo').value.trim();
            const confirmPin  = document.getElementById('cpConfirm').value.trim();
            const msg = document.getElementById('cpMsg');
            msg.style.color = '#b91c1c';

            if (!password)                       { msg.textContent = 'Ingresá tu contraseña.'; return; }
            if (!/^\d{4,}$/.test(nuevoPin))      { msg.textContent = 'El PIN debe tener al menos 4 dígitos.'; return; }
            if (nuevoPin !== confirmPin)         { msg.textContent = 'Los PIN no coinciden.'; return; }

            const token  = document.getElementById('csrfTokenPin').value;
            const header = document.getElementById('csrfHeaderPin').value;
            const btn = document.getElementById('cpBtn');
            btn.disabled = true; btn.textContent = 'Guardando…';
            try {
                const resp = await fetch('/api/auth/cambiarPin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [header]: token },
                    body: JSON.stringify({ password, nuevoPin, confirmPin })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) { msg.textContent = data.error || 'No se pudo cambiar el PIN.'; return; }
                msg.style.color = '#166534';
                msg.textContent = '✅ PIN actualizado.';
                setTimeout(cerrarCambiarPin, 900);
            } catch (e) {
                msg.textContent = 'Error de red: ' + e.message;
            } finally {
                btn.disabled = false; btn.textContent = 'Guardar PIN';
            }
        }
    </script>
