<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">HGS Pharma - Sistema de Gestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>

<aside th:fragment="sidebar(activePage)" class="sidebar">
    <h2><span>🏥</span> HGS Pharma</h2>
    <nav>
        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active'">
            <span>📊</span> Dashboard
        </a>
        <a th:href="@{/config}" th:classappend="${activePage == 'config'} ? 'active'">
            <span>⚙️</span> Configuración
        </a>
        <a th:href="@{/auditoria}" th:classappend="${activePage == 'auditoria'} ? 'active'">
            <span>📜</span> Auditoría
        </a>
        <a href="#" th:classappend="${activePage == 'lotes'} ? 'active'">
            <span>📦</span> Gestión Lotes
        </a>
        <a href="#" th:classappend="${activePage == 'usuarios'} ? 'active'">
            <span>👥</span> Usuarios
        </a>
    </nav>
</aside>

<header th:fragment="header(pageTitle)" class="header">
    <div class="header-left">
        <h1 th:text="${pageTitle}">Panel</h1>
        <p th:text="${#calendars.format(#calendars.createNow(), 'EEEE, d MMMM yyyy')}" style="color: var(--text-secondary); font-size: 0.9rem;"></p>
    </div>
    
    <div class="header-center" style="flex-grow: 1; max-width: 400px; margin: 0 40px;">
        <div class="search-container" style="position: relative;">
            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);">🔍</span>
            <input type="text" class="form-control" placeholder="Buscar medicamento, lote o acción..." style="padding-left: 40px; background: #f1f5f9; border: none;">
        </div>
    </div>

    <div class="header-right" style="display: flex; align-items: center; gap: 15px;" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <div class="user-info" style="text-align: right;" sec:authorize="isAuthenticated()">
            <p style="font-weight: 600; font-size: 0.9rem;" sec:authentication="name">Usuario</p>
            <p style="color: var(--text-secondary); font-size: 0.8rem;" sec:authentication="principal.authorities[0].authority">Rol</p>
        </div>
        <div class="avatar" style="width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer;">
            <span sec:authorize="isAuthenticated()" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
        </div>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn btn-secondary" style="padding: 8px; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;" title="Cerrar Sesión">
                <span>🚪</span>
            </button>
        </form>
    </div>
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.style = `
                background: white;
                padding: 16px 24px;
                border-radius: 12px;
                box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
                margin-bottom: 10px;
                border-left: 4px solid ${type === 'danger' ? '#ef4444' : (type === 'warning' ? '#f59e0b' : '#3b82f6')};
                animation: slideIn 0.3s ease-out;
                display: flex;
                align-items: center;
                gap: 12px;
                min-width: 300px;
            `;
            toast.innerHTML = `
                <span style="font-size: 1.2rem;">${type === 'danger' ? '🚫' : (type === 'warning' ? '⚠️' : 'ℹ️')}</span>
                <span style="font-weight: 500; color: #1e293b;">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.5s ease-in';
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        // Example: Check for success/error in URL and show toast
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('success')) showToast('Operación completada con éxito', 'success');
            if (urlParams.has('error')) showToast('Error: ' + urlParams.get('error'), 'danger');
        });
    </script>
</header>



</body>
</html>
