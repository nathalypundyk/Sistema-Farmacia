<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/main :: head('Configuración de Stock')}"></head>
<body>

<aside th:replace="~{layout/main :: sidebar('config')}"></aside>

<main class="main-content">
    <header th:replace="~{layout/main :: header('Configuración de Stock Mínimo')}"></header>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const CSRF_TOKEN  = /*[[${_csrf.token}]]*/ '';
        const CSRF_HEADER = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
        const MEDS_DATA   = JSON.parse(/*[[${medicamentosJson}]]*/ '[]');
        const PIN_UNLOCKED = /*[[${pinUnlocked}]]*/ false;
        const STOCK_DEFECTO = 100;
        /*]]>*/
    </script>

    <!-- ── Gate de PIN: se pide una vez al entrar, dura toda la sesión ── -->
    <div id="pinGate" style="display:none; position:fixed; inset:0; z-index:3000;
         background:rgba(15,23,42,0.75); backdrop-filter:blur(5px);
         align-items:center; justify-content:center;">
        <div style="background:var(--card-bg,#fff); border-radius:16px; padding:32px 36px;
                    max-width:380px; width:90%; box-shadow:0 24px 48px rgba(0,0,0,0.3); text-align:center;">
            <div style="font-size:2.2rem; margin-bottom:8px;">🔒</div>
            <h2 style="margin:0 0 6px; font-size:1.15rem; color:var(--text-main,#1e293b);">Configuración protegida</h2>
            <p style="font-size:0.86rem; color:var(--text-secondary); margin:0 0 20px;">
                Ingresá tu PIN de administrador para modificar stock mínimo y deseable.</p>
            <input type="password" id="gatePin" maxlength="10" placeholder="PIN"
                   style="width:100%; box-sizing:border-box; padding:11px 14px; text-align:center;
                          border:1.5px solid var(--border-color); border-radius:9px; font-size:1.2rem;
                          letter-spacing:4px; background:var(--input-bg,#f8fafc); color:var(--text-main);
                          outline:none; margin-bottom:8px;"
                   onkeydown="if(event.key==='Enter') desbloquear()">
            <div id="gateError" style="color:#b91c1c; font-size:0.82rem; min-height:18px; margin-bottom:14px;"></div>
            <div style="display:flex; gap:10px;">
                <a href="/" class="btn" style="flex:1; background:#f1f5f9; color:#475569; padding:10px; text-decoration:none; border-radius:9px;">Volver</a>
                <button type="button" id="gateBtn" class="btn btn-primary" style="flex:1; padding:10px;"
                        onclick="desbloquear()">Desbloquear</button>
            </div>
        </div>
    </div>

    <div style="margin-top: 24px;">

        <!-- Barra superior sticky -->
        <div id="topBar" style="position:sticky; top:0; z-index:20; background:var(--card-bg);
                    border:1px solid var(--border-color); border-radius:12px; padding:14px 20px;
                    margin-bottom:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
                    box-shadow:0 2px 8px rgba(0,0,0,0.06);">

            <!-- Búsqueda -->
            <div style="position:relative; flex:1; min-width:200px;">
                <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;"
                     xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input id="buscar" type="text" placeholder="Buscar medicamento..."
                       oninput="renderTabla()"
                       style="width:100%; padding:8px 8px 8px 32px; border:1px solid var(--border-color);
                              border-radius:8px; background:var(--input-bg,#f8fafc); color:var(--text-primary);
                              font-size:.88rem; box-sizing:border-box; outline:none;">
            </div>

            <!-- Filtro -->
            <select id="filtro" onchange="renderTabla()"
                    style="padding:8px 12px; border:1px solid var(--border-color); border-radius:8px;
                           background:var(--input-bg,#f8fafc); color:var(--text-primary); font-size:.88rem; cursor:pointer;">
                <option value="todos">Todos</option>
                <option value="sin_configurar">Sin mínimo configurado</option>
                <option value="criticos">Stock crítico / agotado</option>
                <option value="ok">Stock OK</option>
            </select>

            <span id="contadorFiltro" style="font-size:.82rem; color:var(--text-secondary); white-space:nowrap;"></span>
            <span style="flex:1;"></span>

            <!-- Cambios pendientes -->
            <span id="badgeCambios" style="display:none; padding:5px 12px; background:#fef3c7; color:#92400e;
                                           border-radius:20px; font-size:.82rem; font-weight:600;"></span>

            <!-- ── Recomendación inteligente ── -->
            <div style="border-left:1px solid var(--border-color); padding-left:12px;">
                <button id="btnRecomendar" onclick="autoRecomendar()"
                        title="Calcula mínimo (30 días) y deseable (90 días) basado en consumo histórico"
                        style="padding:7px 14px; background:#0ea5e9; color:white; border:none;
                               border-radius:8px; font-size:.84rem; font-weight:600; cursor:pointer;
                               white-space:nowrap;">
                    ⚡ Recomendar
                </button>
            </div>

            <!-- Botón guardar -->
            <button id="btnGuardar" onclick="guardarTodo()" disabled
                    style="padding:9px 22px; background:var(--primary,#6366f1); color:white; border:none;
                           border-radius:9px; font-size:.9rem; font-weight:600; cursor:pointer; opacity:.5;
                           transition:opacity .2s;">
                Guardar cambios
            </button>
        </div>

        <!-- Mensaje de éxito/error -->
        <div id="msgBar" style="display:none; padding:12px 18px; border-radius:10px; margin-bottom:14px;
                                font-size:.88rem; font-weight:500;"></div>

        <!-- Tabla -->
        <div class="card" style="padding:0; overflow:hidden;">
            <table style="width:100%; border-collapse:collapse; font-size:.84rem;">
                <thead>
                    <tr style="background:var(--table-header-bg,#f8fafc);">
                        <th style="padding:10px 14px; text-align:left; font-size:.76rem; color:var(--text-secondary); font-weight:600;">Cód. SICIAP</th>
                        <th style="padding:10px 14px; text-align:left; font-size:.76rem; color:var(--text-secondary); font-weight:600;">Medicamento</th>
                        <th style="padding:10px 14px; text-align:center; font-size:.76rem; color:var(--text-secondary); font-weight:600;">Stock actual</th>
                        <th style="padding:10px 14px; text-align:center; font-size:.76rem; color:var(--text-secondary); font-weight:600;">Mínimo</th>
                        <th style="padding:10px 14px; text-align:center; font-size:.76rem; color:var(--text-secondary); font-weight:600;">Deseable</th>
                        <th style="padding:10px 14px; text-align:center; font-size:.76rem; color:var(--text-secondary); font-weight:600;">Estado</th>
                    </tr>
                </thead>
                <tbody id="tbodyConfig"></tbody>
            </table>
            <div id="sinResultados" style="display:none; text-align:center; padding:40px; color:var(--text-secondary); font-size:.9rem;">
                No se encontraron medicamentos con ese filtro.
            </div>
        </div>
    </div>
</main>

<script>
// ── Estado ─────────────────────────────────────────────────────────────────
const meds = MEDS_DATA.map(m => ({...m})); // copia local
const cambios = {};        // { id: { minimo?, deseable? } }
const recomendados = {};   // { id: RecomendacionItem } — para mostrar contexto

function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Render ──────────────────────────────────────────────────────────────────
function renderTabla() {
    const q      = document.getElementById('buscar').value.toLowerCase().trim();
    const filtro = document.getElementById('filtro').value;

    const visibles = meds.filter(m => {
        const txt = (m.nombre + ' ' + m.concentracion + ' ' + m.codigoSiciap).toLowerCase();
        if (q && !txt.includes(q)) return false;
        if (filtro === 'sin_configurar') return !m.minimo || m.minimo === 0;
        if (filtro === 'criticos')       return m.stockTotal === 0 || (m.minimo > 0 && m.stockTotal < m.minimo);
        if (filtro === 'ok')             return m.stockTotal > 0 && (!m.minimo || m.stockTotal >= m.minimo);
        return true;
    });

    document.getElementById('contadorFiltro').textContent = visibles.length + ' medicamento(s)';
    document.getElementById('sinResultados').style.display = visibles.length === 0 ? '' : 'none';

    const tbody = document.getElementById('tbodyConfig');
    tbody.innerHTML = visibles.map(m => {
        const modificado    = cambios[m.id];
        const esRecomendado = modificado && recomendados[m.id];
        const rowBg = esRecomendado ? 'background:#eff6ff;' : (modificado ? 'background:#fffbeb;' : '');
        const minVal  = modificado?.minimo   !== undefined ? modificado.minimo   : (m.minimo   ?? STOCK_DEFECTO);
        const desVal  = modificado?.deseable !== undefined ? modificado.deseable : (m.deseable ?? STOCK_DEFECTO);

        const stockColor = m.stockTotal === 0 ? '#dc2626' : (m.minimo > 0 && m.stockTotal < m.minimo ? '#d97706' : '#059669');
        const estadoBadge = m.stockTotal === 0
            ? '<span style="font-size:.72rem;padding:2px 8px;border-radius:20px;background:#fee2e2;color:#991b1b;">AGOTADO</span>'
            : m.minimo > 0 && m.stockTotal < m.minimo
                ? '<span style="font-size:.72rem;padding:2px 8px;border-radius:20px;background:#ffedd5;color:#9a3412;">CRÍTICO</span>'
                : '<span style="font-size:.72rem;padding:2px 8px;border-radius:20px;background:#dcfce7;color:#166534;">OK</span>';

        const rec = recomendados[m.id];
        const confianzaColor = { ALTA: '#059669', MEDIA: '#d97706', BAJA: '#dc2626', MUY_BAJA: '#9ca3af' };
        const confianzaLabel = { ALTA: 'Alta', MEDIA: 'Media', BAJA: 'Baja', MUY_BAJA: 'Muy baja' };
        const recHint = rec
            ? `<div style="font-size:.72rem;color:${confianzaColor[rec.confianza]};margin-top:2px;">
                   ⚡ ${rec.avgDiario}/día · ${confianzaLabel[rec.confianza]}
               </div>`
            : '';

        return `<tr style="border-top:1px solid var(--border-color);${rowBg}" id="row_${m.id}">
            <td style="padding:8px 14px;">
                ${m.codigoSiciap
                    ? `<span style="font-family:monospace;font-size:.82rem;color:#1d4ed8;">${esc(m.codigoSiciap)}</span>`
                    : '<span style="color:var(--text-secondary);font-size:.78rem;">—</span>'}
            </td>
            <td style="padding:8px 14px;">
                <div style="font-weight:500;">${esc(m.nombre)}</div>
                ${m.concentracion ? `<div style="font-size:.78rem;color:var(--text-secondary);">${esc(m.concentracion)}</div>` : ''}
            </td>
            <td style="padding:8px 14px; text-align:center; font-weight:600; color:${stockColor};">
                ${m.stockTotal}
            </td>
            <td style="padding:8px 14px; text-align:center;">
                <input type="number" min="0" value="${minVal}"
                       oninput="onCambio(${m.id}, 'minimo', this.value)"
                       style="width:80px; padding:5px 8px; border:1px solid var(--border-color); border-radius:6px;
                              text-align:center; font-size:.84rem; background:var(--input-bg,#f8fafc);
                              color:var(--text-primary); outline:none;">
                ${recHint}
            </td>
            <td style="padding:8px 14px; text-align:center;">
                <input type="number" min="0" value="${desVal}"
                       oninput="onCambio(${m.id}, 'deseable', this.value)"
                       style="width:80px; padding:5px 8px; border:1px solid var(--border-color); border-radius:6px;
                              text-align:center; font-size:.84rem; background:var(--input-bg,#f8fafc);
                              color:var(--text-primary); outline:none;">
            </td>
            <td style="padding:8px 14px; text-align:center;">${estadoBadge}</td>
        </tr>`;
    }).join('');
}

// ── Tracking de cambios ──────────────────────────────────────────────────────
function onCambio(id, campo, valor) {
    const v = valor === '' ? null : parseInt(valor);
    if (!cambios[id]) cambios[id] = {};
    cambios[id][campo] = v;

    // Highlight row
    const row = document.getElementById('row_' + id);
    if (row) row.style.background = '#fffbeb';

    updateBadge();
}

function updateBadge() {
    const n = Object.keys(cambios).length;
    const badge = document.getElementById('badgeCambios');
    const btn   = document.getElementById('btnGuardar');
    if (n > 0) {
        badge.textContent = n + ' cambio(s) sin guardar';
        badge.style.display = '';
        btn.disabled = false;
        btn.style.opacity = '1';
    } else {
        badge.style.display = 'none';
        btn.disabled = true;
        btn.style.opacity = '.5';
    }
}

// ── Guardar ──────────────────────────────────────────────────────────────────
async function guardarTodo() {
    const items = Object.entries(cambios).map(([id, vals]) => ({ id: parseInt(id), ...vals }));

    if (!items.length) { showMsg('No hay cambios para guardar.', false); return; }

    const btn = document.getElementById('btnGuardar');
    btn.disabled = true; btn.textContent = 'Guardando…';

    try {
        const resp = await fetch('/api/config/bulk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [CSRF_HEADER]: CSRF_TOKEN },
            body: JSON.stringify({ items })
        });
        const data = await resp.json();

        if (!resp.ok) {
            // 403 → la sesión perdió el desbloqueo; volver a pedir PIN
            if (resp.status === 403) { mostrarGate(); }
            showMsg(data.error || 'Error al guardar.', false);
            return;
        }

        // Actualizar datos locales y limpiar cambios
        items.forEach(item => {
            const med = meds.find(m => m.id === item.id);
            if (!med) return;
            if (item.minimo  !== undefined) med.minimo  = item.minimo;
            if (item.deseable !== undefined) med.deseable = item.deseable;
        });
        for (const id in cambios) delete cambios[id];

        showMsg(`✅ ${data.actualizados} medicamento(s) actualizados correctamente.`, true);
        updateBadge();
        renderTabla();
        document.getElementById('pinInput').value = '';
    } catch (e) {
        showMsg('Error de red: ' + e.message, false);
    } finally {
        btn.disabled = false; btn.textContent = 'Guardar cambios';
        updateBadge();
    }
}

// ── Recomendación inteligente ────────────────────────────────────────────────
async function autoRecomendar() {
    const btn = document.getElementById('btnRecomendar');
    btn.disabled = true; btn.textContent = '⚡ Calculando…';

    try {
        const resp = await fetch('/api/config/recomendar',
            { headers: { [CSRF_HEADER]: CSRF_TOKEN } }
        );
        const data = await resp.json();

        if (!resp.ok) { showMsg(data.error || 'Error al calcular recomendaciones.', false); return; }
        if (!data.length) {
            showMsg('No hay historial de salidas suficiente para generar recomendaciones.', false);
            return;
        }

        let aplicadas = 0;
        const porConfianza = { ALTA: 0, MEDIA: 0, BAJA: 0, MUY_BAJA: 0 };

        data.forEach(rec => {
            recomendados[rec.id] = rec;
            if (!cambios[rec.id]) cambios[rec.id] = {};
            cambios[rec.id].minimo   = rec.minimoRecomendado;
            cambios[rec.id].deseable = rec.deseableRecomendado;
            porConfianza[rec.confianza] = (porConfianza[rec.confianza] || 0) + 1;
            aplicadas++;
        });

        const resumen = [
            porConfianza.ALTA     ? `${porConfianza.ALTA} alta`     : '',
            porConfianza.MEDIA    ? `${porConfianza.MEDIA} media`   : '',
            porConfianza.BAJA     ? `${porConfianza.BAJA} baja`     : '',
            porConfianza.MUY_BAJA ? `${porConfianza.MUY_BAJA} muy baja` : '',
        ].filter(Boolean).join(' · ');

        showMsg(
            `⚡ ${aplicadas} recomendaciones aplicadas (confianza: ${resumen}). Revisá los valores y guardá con tu PIN.`,
            true
        );
        updateBadge();
        renderTabla();
    } catch (e) {
        showMsg('Error de red: ' + e.message, false);
    } finally {
        btn.disabled = false; btn.textContent = '⚡ Recomendar';
    }
}

function showMsg(msg, ok) {
    const el = document.getElementById('msgBar');
    el.textContent = msg;
    el.style.display = '';
    el.style.background = ok ? '#dcfce7' : '#fee2e2';
    el.style.color      = ok ? '#166534' : '#991b1b';
    el.style.border     = ok ? '1px solid #bbf7d0' : '1px solid #fecaca';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ── PIN gate (una vez por sesión) ──────────────────────────────────────────────
function mostrarGate() {
    const gate = document.getElementById('pinGate');
    gate.style.display = 'flex';
    setTimeout(() => document.getElementById('gatePin').focus(), 60);
}

async function desbloquear() {
    const pin = document.getElementById('gatePin').value.trim();
    const err = document.getElementById('gateError');
    if (!pin) { err.textContent = 'Ingresá tu PIN.'; return; }
    const btn = document.getElementById('gateBtn');
    btn.disabled = true; btn.textContent = 'Verificando…';
    try {
        const resp = await fetch('/api/config/unlock', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [CSRF_HEADER]: CSRF_TOKEN },
            body: JSON.stringify({ pin })
        });
        if (!resp.ok) {
            const data = await resp.json().catch(() => ({}));
            err.textContent = data.error || 'PIN incorrecto.';
            return;
        }
        document.getElementById('pinGate').style.display = 'none';
    } catch (e) {
        err.textContent = 'Error de red: ' + e.message;
    } finally {
        btn.disabled = false; btn.textContent = 'Desbloquear';
    }
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    renderTabla();
    if (!PIN_UNLOCKED) mostrarGate();
});
</script>

</body>
</html>
