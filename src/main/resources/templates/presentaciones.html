<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Presentaciones')}"></head>
<body>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: var(--white);
            margin: 8% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .close {
            color: var(--text-secondary);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: var(--text-primary);
        }
    </style>

    <aside th:replace="~{layout/main :: sidebar('presentaciones')}"></aside>

    <main class="main-content">
        <header th:replace="~{layout/main :: header('Presentaciones')}"></header>

        <div class="content-area">
            <div class="card" style="margin-bottom: 24px; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="font-size: 1.25rem; font-weight: 600;">Presentaciones</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">Administra los formatos de presentación de los medicamentos (Ej: Comprimidos, Ampollas, Jarabe).</p>
                </div>
                <button class="btn btn-primary" onclick="openModal()" style="display: flex; align-items: center; gap: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Agregar Presentación
                </button>
            </div>

            <div th:if="${param.success}" class="card" style="margin-bottom: 24px; padding: 15px; background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0;">
                Operación realizada con éxito.
            </div>
            <div th:if="${param.error}" class="card" style="margin-bottom: 24px; padding: 15px; background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca;">
                <span th:text="${param.error}">Ha ocurrido un error.</span>
            </div>

            <div class="card" style="padding: 0;">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Unidades</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pres : ${presentaciones}">
                                <td>
                                    <span class="badge" style="background: #e2e8f0; color: #475569;" th:text="${pres.id}">1</span>
                                </td>
                                <td>
                                    <span style="font-weight: 500;" th:text="${pres.nombre}">Nombre</span>
                                </td>
                                <td th:text="${pres.unidades != null ? pres.unidades : '-'}">0</td>
                                <td style="display: flex; gap: 8px;">
                                    <button class="btn" style="padding: 6px; background: #f1f5f9; color: #3b82f6;" title="Editar"
                                            th:onclick="editPresentacion([[${pres.id}]], [[${pres.nombre}]], [[${pres.unidades}]])">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    </button>
                                    <a th:href="@{/presentaciones/eliminar/{id}(id=${pres.id})}" class="btn" style="padding: 6px; background: #fee2e2; color: #ef4444;" title="Eliminar" onclick="return confirm('¿Estás seguro de que deseas eliminar esta presentación?');">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(presentaciones)}">
                                <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                                    No hay presentaciones registradas.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Agregar/Editar Presentación -->
    <div id="addPresentacionModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-bottom: 24px; font-size: 1.5rem;">Agregar Presentación</h2>

            <form th:action="@{/presentaciones/guardar}" method="post" th:object="${nuevaPresentacion}">
                <input type="hidden" id="presId" name="id" />
                
                <div class="form-group">
                    <label for="nombre">Nombre de la Presentación *</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Comprimidos" required>
                </div>

                <div class="form-group">
                    <label for="unidades">Unidades por Presentación</label>
                    <input type="number" id="unidades" name="unidades" class="form-control" placeholder="Ej: 30" min="0">
                </div>

                <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="button" class="btn" style="background: #f1f5f9; color: #475569;" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Presentación</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById("addPresentacionModal");

        function openModal() {
            document.getElementById("presId").value = "";
            document.getElementById("nombre").value = "";
            document.getElementById("unidades").value = "";
            document.getElementById("modalTitle").innerText = "Agregar Presentación";
            modal.style.display = "block";
        }
        
        function editPresentacion(id, nombre, unidades) {
            document.getElementById("presId").value = id;
            document.getElementById("nombre").value = nombre;
            document.getElementById("unidades").value = unidades || '';
            document.getElementById("modalTitle").innerText = "Editar Presentación";
            modal.style.display = "block";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
