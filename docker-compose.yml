version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: farmacia-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-farmaciadb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: farmacia-app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-farmaciadb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-http://localhost:3000}
      WHATSAPP_ENCARGADA_NUMERO: ${WHATSAPP_ENCARGADA_NUMERO:-595986214339}
    extra_hosts:
      # Permite que el contenedor alcance un gateway WhatsApp corriendo en el host
      # (fuera de Docker) usando host.docker.internal en WHATSAPP_API_URL.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
